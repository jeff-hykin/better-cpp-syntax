name: Run Tests

on:
  push:
    paths:
    - '**.rb'
    - '**.js'
    - package.json
    - 'source/*/examples/*.*'
  pull_request:
    paths:
    - '**.rb'
    - '**.js'
    - package.json
    - 'source/*/examples/*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js for use with actions
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Setup Ruby for use with actions
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 2.7
      - name: test
        run: |
          gem install bundler
          bundler install
          npm ci
          run/build
          run/test
        env:
          CI: true
